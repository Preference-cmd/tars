[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/tui", "crates/sandbox"]
default-members = ["crates/cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT"

[workspace.dependencies]
causa = { version = "0.2", default-features = false, features = ["runtime", "providers", "extensions"] }

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v7"] }
thiserror = "2"
serde_json = "1"
async-trait = "0.1"
futures-util = "0.3"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
url = "2"
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
rustix = { version = "1.1", features = ["fs"] }
similar = "3"
# External tool downloads. The version and feature set reuse the graph that
# Causa's provider already brings in (0.12, rustls + webpki roots, HTTP/1.1);
# no default-tls, charset or system-proxy feature is added.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
