[workspace]
resolver = "3"
members = ["crates/tarz-core", "crates/tarz-cli", "crates/tarz-tui"]
default-members = ["crates/tarz-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
causa = { version = "0.1", default-features = false, features = ["runtime", "providers"] }

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v7"] }
thiserror = "2"
serde_json = "1"
async-trait = "0.1"
futures-util = "0.3"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
url = "2"
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
rustix = { version = "1.1", features = ["fs"] }
similar = "3"
