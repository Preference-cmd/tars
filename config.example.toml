# Copy to your global config path or pass --config /path/to/config.toml.
# Paths below are relative to this file, not the shell's working directory.
version = 1
store = "data"
recovery_dir = "."
default_profile = "default"

[profiles.default]
provider = "openai-chat"
model = "replace-with-your-model-id"
api_key_env = "OPENAI_API_KEY"
# endpoint = "http://127.0.0.1:8080/v1/chat/completions"
timeout_secs = 120
capacity = 256
max_model_rounds = 10
max_tool_calls = 64
# Output token limit per model call. No default; the anthropic protocol requires it.
# max_tokens = 8192
# reasoning_effort = "medium"  # none | minimal | low | medium | high | xhigh
# Model calls per round when the provider fails transiently or rate-limits. Default 1 (no retry).
# max_model_attempts = 3
# Initial permission mode for a new session: read-only | ask | accept-edits | full-access.
# Reopening restores the saved current mode, except full-access, which returns to ask
# unless full-access was the initial mode.
# permission_mode = "ask"
# Explicit opt-in: root alone does not enable tools.
# workspace_root = "../my-project"
# tools = ["list_directory", "read_file", "search_text", "write_file", "edit_file", "run_command"]
# Add "write_file" and "edit_file" to enable workspace writes; ask mode confirms each write.
# MCP servers are defined in mcp.json next to this file (or in TARS_MCP_CONFIG).
# Select them by id; omitted or empty selects none.
# mcp = ["git"]

# Optional lower limits (never raises the supported ceilings).
# [profiles.default.tool_limits]
# max_concurrent_operations = 2
# call_timeout_secs = 5
# max_output_bytes = 32768

# Optional lower write limits (never raises the supported ceilings).
# Command settings are only valid when run_command is selected.
# [profiles.default.command]
# network = "none"              # none | open
# default_timeout_secs = 120
# max_timeout_secs = 600

# [profiles.default.write_limits]
# max_edit_file_bytes = 1048576
# max_write_bytes = 524288
# max_edit_segments = 16

# Render options for the protocol, checked against Causa's options type for it.
# For openai-chat, a server that reads only max_tokens needs:
# [profiles.default.render_options]
# max_tokens_field = "max_tokens"

# Add more [profiles.NAME] sections, selected by --profile NAME.
# Existing saved sessions keep their original definition when reopened.
