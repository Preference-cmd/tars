name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo build -p tarz-core --locked
      - run: cargo doc --workspace --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  cargo-deny:
    # Advisories, licenses, duplicate versions and sources; deny.toml
    # holds the policy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked --release
      - name: CLI smoke
        shell: bash
        run: |
          binary=target/release/tarz
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          "$binary" --help
          "$binary" --version
          "$binary" run --help
          "$binary" session --help
          "$binary" demo
