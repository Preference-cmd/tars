name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo build -p tars-core --locked
      - run: cargo doc --workspace --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  cargo-deny:
    # Advisories, licenses, duplicate versions and sources; deny.toml
    # holds the policy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    strategy:
      matrix:
        # Windows is left out for now; restore it here when it is supported again.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy
      # The quality job lints Linux; macOS-only (Seatbelt) code is linted
      # here on its own platform.
      - name: Clippy (platform-specific code)
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      # Tests are split in code: common suites run on every platform, while
      # workspace tools and SIGINT need Unix and sandboxed execution runs
      # Seatbelt on macOS and Bubblewrap (`bwrap`) on Linux.
      - name: Install Bubblewrap (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,

            # Site-specific additions and overrides. See local/README for details.
            include if exists <local/bwrap>
          }
          EOF
          if command -v apparmor_parser >/dev/null 2>&1 && [ -d /sys/kernel/security/apparmor ]; then
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --unshare-user --unshare-pid --unshare-net --ro-bind / / /bin/true
      - name: Tests (common + platform-specific)
        run: cargo test --workspace --locked
      - run: cargo build --workspace --locked --release
      - name: CLI smoke
        shell: bash
        run: |
          binary=target/release/tars
          "$binary" -h
          "$binary" --help
          "$binary" -V
          "$binary" --version
          "$binary" run --help
          "$binary" session --help
          "$binary" session list --no-config --store "$RUNNER_TEMP/tars-store"
