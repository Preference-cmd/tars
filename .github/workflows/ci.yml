name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo build -p tars-core --locked
      - run: cargo doc --workspace --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  cargo-deny:
    # Advisories, licenses, duplicate versions and sources; deny.toml
    # holds the policy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    strategy:
      matrix:
        # Windows is left out for now; restore it here when it is supported again.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy
      # The quality job lints Linux; macOS-only (Seatbelt) code is linted
      # here on its own platform.
      - name: Clippy (platform-specific code)
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      # Tests are split in code: common suites run on every platform, while
      # workspace tools and SIGINT need Unix and Seatbelt needs macOS, so those
      # suites only compile where the platform supports them.
      - name: Tests (common + platform-specific)
        run: cargo test --workspace --locked
      - run: cargo build --workspace --locked --release
      - name: CLI smoke
        shell: bash
        run: |
          binary=target/release/tars
          "$binary" --help
          "$binary" --version
          "$binary" run --help
          "$binary" session --help
          "$binary" demo
