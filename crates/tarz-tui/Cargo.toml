[package]
name = "tarz-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Experimental terminal interface for Tarz"

[dependencies]
tarz-core = { path = "../tarz-core" }
causa.workspace = true
tokio.workspace = true
futures-util.workspace = true
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-textarea = "0.9.2"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
