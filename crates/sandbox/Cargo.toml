[package]
name = "tars-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Platform sandbox policy, backend selection and process control for TARS"

[dependencies]
thiserror.workspace = true
tokio.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[features]
# Explicit test seams (backend injection and recording backend). Enabled only
# from a consumer's [dev-dependencies]; normal and release builds omit them.
test-support = []

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
