# cargo-deny: security advisories, licenses, duplicate versions and
# dependency sources for the workspace graph (dev-dependencies included).
# Part of the local check list in docs/README.md.

[graph]
all-features = true

[advisories]
# Every advisory fails the check, unmaintained and unsound included; an
# accepted one goes in `ignore` with the reason beside it.
ignore = []

[licenses]
# Measured against the dependency graph: each entry is needed by at least
# one dependency that offers no license already listed here.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# The workspace crates are not published and are not checked.
ignore = true

[bans]
# Several versions of one crate are common in an async stack; report
# them without failing.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the workspace crates are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
